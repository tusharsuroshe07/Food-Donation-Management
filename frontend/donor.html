<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Connect | Donor Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">🌿 Food Connect</div>
        <ul>
            <li><span id="welcomeText" style="font-weight:400; margin-right:1rem;"></span></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </nav>
    <div class="container animate-fade">
        <h2 class="mb-1">Donor Dashboard</h2>
        <div id="messageBox" class="hidden"></div>
        <div class="grid">
            <div class="card">
                <h3>Post a Food Donation</h3>
                <p class="text-muted mb-1">Help feed the community by posting excess food.</p>
                <form id="donationForm">
                    <div class="form-group">
                        <label>Food Description (e.g. 5 boxes of Sandwiches)</label>
                        <input type="text" id="food_type" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Approx. Quantity (e.g. 20 meals)</label>
                        <input type="text" id="quantity" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Pickup Location</label>
                        <input type="text" id="location" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Expires By</label>
                        <input type="datetime-local" id="expiry_time" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-orange">Post Food Item</button>
                </form>
            </div>
            <div class="card">
                <h3>Your Donation History</h3>
                <p class="text-muted mb-1">Track the status of your past donations.</p>
                <div id="donationsList">
                    <p class="text-muted">Loading your past donations...</p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/donor.js"></script>
</body>
</html>
